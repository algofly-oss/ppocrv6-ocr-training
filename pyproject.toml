[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppocrv6-ocr-training"
version = "0.1.0"
description = "Notebook-first PP-OCRv6-derived recognition training and deployment"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.10.0", "torchvision==0.25.0", "timm==1.0.27",
  "pytorch-lightning==2.5.1", "nltk==3.10.4", "numpy==1.26.4",
  "Pillow==12.3.0", "PyYAML==6.0.1"
]

[project.optional-dependencies]
notebooks = ["jupyterlab==4.4.3", "ipykernel==6.29.5", "matplotlib==3.9.1"]
onnx = ["onnx==1.21.0", "onnxruntime==1.23.2"]
tensorrt = ["tensorrt-cu12==10.15.1.29", "nvidia-ml-py>=12"]
waterec-tensorrt = ["tensorrt-cu12==10.15.1.29", "nvidia-ml-py>=12", "pycuda==2026.1", "cuda-bindings==12.9.4"]
ppocr = ["paddlepaddle==3.2.2", "paddle2onnx==2.0.1", "onnx2torch==1.5.15", "onnxsim==0.4.36", "opencv-python-headless==4.10.0.84", "onnx==1.21.0", "onnxruntime==1.23.2"]
ppocr-tensorrt = ["tensorrt-cu12==10.15.1.29", "nvidia-ml-py>=12", "pycuda==2026.1", "cuda-bindings==12.9.4", "opencv-python-headless==4.10.0.84"]
test = ["pytest==8.3.5", "nbformat==5.10.4", "httpx==0.28.1", "fastapi==0.135.3"]

[project.scripts]
ppocr-ocr = "parseq_ocr.ppocr_cli:main"

[tool.setuptools.packages.find]
include = ["parseq_ocr*"]

[tool.setuptools.package-data]
parseq_ocr = ["_native/waterec/*.c", "_native/waterec/*.cu", "_native/waterec/PILLOW_LICENSE", "_vendor/parseq/**/*.py", "_vendor/parseq/**/*.yaml", "_vendor/parseq/LICENSE", "_vendor/parseq/NOTICE", "_vendor/parseq/source_pin.json", "_vendor/waterec/*.txt", "_vendor/waterec/LICENSE", "_vendor/waterec/NOTICE", "_vendor/waterec/source_pin.json", "_vendor/ppocr/LICENSE", "_vendor/ppocr/NOTICE", "_vendor/ppocr/source_pin.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
