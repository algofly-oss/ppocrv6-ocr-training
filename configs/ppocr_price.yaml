# Custom price reader derived from PP-OCRv6_medium_rec, not an official preset.
family: ppocr_price
dataset_root: dataset_price
output_dir: artifacts/ppocr_price
pretrained_dir: weights/ppocr_medium
height: 128
width: 320
epochs: 15
batch_size: 64
holdout_fraction: 0.15
seed: 20261114
# Historical winning recipe selected epoch15 by exact internal holdout.
selection_metric: exact
recover_bn: true
auxiliary: true
learning_rate: 0.0001
weight_decay: 0.00003
device: cuda
precision: bf16
